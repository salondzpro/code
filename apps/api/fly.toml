# Déploiement Fly.io — construire depuis la RACINE du monorepo :
#   fly launch --no-deploy --copy-config --name salondz-api   (une fois)
#   fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile .
#   fly secrets set SUPABASE_URL=... SUPABASE_PUBLISHABLE_KEY=... SUPABASE_SECRET_KEY=... SUPABASE_JWT_SECRET=... INTERNAL_CRON_TOKEN=... CORS_ORIGINS=https://salondz.pages.dev
app = "salondz-api"
primary_region = "cdg"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
