# Blueprint Render — API Fastify (Docker, Francfort) + site web statique (CDN), plans gratuits.
# Dashboard → New → Blueprint → dépôt salondzpro/code : Render lit ce fichier.
# Les variables `sync: false` sont à renseigner dans le dashboard (ou via l'API Render) :
#   SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY, SUPABASE_JWT_SECRET, INTERNAL_CRON_TOKEN, SENTRY_DSN (optionnel)
# Plan gratuit : 750 h d'instance/mois, mise en veille après 15 min sans requête → le cron
# Supabase (0010, toutes les 10 min) maintient l'API éveillée.
services:
  - type: web
    name: salondz-api
    runtime: docker
    repo: https://github.com/salondzpro/code
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - docs/PRODUCTION.md
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        value: https://thpwvmtqzhtqlosgvced.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: INTERNAL_CRON_TOKEN
        sync: false
      - key: PLAN_ACCESS_CODE
        value: "123"
      - key: SENTRY_DSN
        sync: false
      # Origines web autorisées (CSV) : site statique Render + domaine custom plus tard.
      # `https://localhost` et `capacitor://localhost` = l'APPLICATION MOBILE (coque Capacitor) : le site
      # y est embarqué, donc ses appels partent de cette origine et non de salondz.com.
      - key: CORS_ORIGINS
        value: https://salondz.pages.dev,https://salondz.onrender.com,https://salondz.com,https://www.salondz.com,https://admin.salondz.com,https://localhost,capacitor://localhost
      # Origine publique de l'API : OBLIGATOIRE (liens des e-mails ; jamais déduite de l'en-tête Host).
      - key: API_PUBLIC_URL
        value: https://api.salondz.com
      # Origine du site (retours des liens e-mail).
      - key: WEB_URL
        value: https://salondz.com
      # E-mails transactionnels (Resend, domaine salondz.com vérifié).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Salon DZ <noreply@salondz.com>
      - key: EMAIL_REPLY_TO
        value: support@salondz.com
      # Notifications de l'APPLICATION MOBILE (coque Capacitor) : clé de service Firebase (FCM v1),
      # le JSON complet sur une ligne. Sans elle, l'envoi mobile est désactivé sans rien casser.
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      # Web Push (VAPID) : la clé publique est aussi VITE_VAPID_PUBLIC_KEY côté site.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@salondz.com
      # Comptes de démonstration (0603044618 / 0603044619, code 1111) : DÉSACTIVÉS par défaut dans le code.
      # « 1 » les active — à retirer avant l'ouverture au public (décision propriétaire, voir docs/PRODUCTION.md).
      - key: TEST_LOGIN_ENABLED
        value: "0"

  # Web (Vite/React) → site statique Render : gratuit, CDN global, ne consomme pas les heures d'instance.
  # Création en une commande (sans dashboard) : node --env-file=.env scripts/render-web.mjs
  - type: web
    name: salondz
    runtime: static
    repo: https://github.com/salondzpro/code
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile --filter "@salondz/web..." && pnpm --filter @salondz/web build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .npmrc
        - render.yaml
    routes:
      # Pages salon : l'API renvoie l'index.html enrichi des balises de partage (aperçu WhatsApp/Instagram).
      - type: rewrite
        source: /s/*
        destination: https://api.salondz.com/share/s/*
      - type: rewrite
        source: /sitemap.xml
        destination: https://api.salondz.com/sitemap.xml
      - type: rewrite
        source: /moi
        destination: https://api.salondz.com/moi
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Le CDN met en cache par URL DEMANDÉE, pas par fichier physique servi : une route comme /supprimer,
      # servie par le même index.html via la réécriture générique /*, restait bloquée sur l'ancienne version
      # de l'application tant que /`et`/index.html` seuls portaient `no-cache` (22 sept. 2026, page /supprimer
      # invisible malgré un déploiement "live"). Toute route non-asset doit rester fraîche à chaque visite ;
      # seuls les fichiers d'empreinte (assets, polices) peuvent être mis en cache indéfiniment, et leurs
      # règles, plus spécifiques, sont déclarées APRÈS pour l'emporter sur ce `/*`.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(self), microphone=()
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PNPM_VERSION
        value: 10.15.0
      - key: VITE_SUPABASE_URL
        value: https://thpwvmtqzhtqlosgvced.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: https://api.salondz.com
      # Web Push navigateur (même valeur que VAPID_PUBLIC_KEY de l'API) et remontée d'erreurs.
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
