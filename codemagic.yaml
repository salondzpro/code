# Compilation iOS de Salon DZ sur macOS distant (Codemagic), puis envoi sur TestFlight.
#
# POURQUOI CE FICHIER : l'application Android se compile sur le PC du propriétaire en quatre minutes,
# mais une application iOS EXIGE macOS — c'est une contrainte d'Apple, pas un choix technique. Ce
# fichier décrit la compilation pour une machine macOS louée à la minute (500 min/mois gratuites),
# afin de ne pas avoir à acheter un Mac.
#
# À FAIRE UNE FOIS, côté Codemagic (interface web) — état au 30 sept. 2026 :
#   1. Connecter ce dépôt GitHub.  ✔ fait
#   2. Ajouter la clé App Store Connect (Teams → Integrations → Apple Developer Portal).
#      ✔ fait : intégration « salondz_asc », Key ID GZ7CF8ABHX. C'est une clé PROPRE à Codemagic,
#      distincte de `secrets/AuthKey_4HZRQ9GV7F.p8` qui sert aux scripts `asc-*` depuis le PC.
#   3. **Régler l'application sur « Use codemagic.yaml »** et non sur le Workflow Editor. Tant
#      qu'elle est sur l'éditeur visuel, CE FICHIER EST IGNORÉ — aucune compilation, aucune erreur,
#      aucune trace. C'est la cause la plus probable du silence observé le 29 sept. : deux
#      étiquettes poussées, zéro build reçu par Apple en 45 minutes.
#   4. Lancer une première compilation À LA MAIN (« Start new build », branche `main`). Codemagic
#      n'arme ses déclencheurs automatiques qu'après avoir vu le dépôt une première fois.
#
# L'application « Salon DZ » existe dans App Store Connect depuis le 29 sept. 2026 (id 6817317513) ;
# sa fiche, ses visuels et sa classification sont remplis par les scripts `scripts/asc-*.mjs`.
workflows:
  ios:
    name: Salon DZ · iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Ce nom doit être EXACTEMENT celui donné à l'intégration dans Codemagic (Teams → Integrations
      # → Apple Developer Portal). S'il diffère, la compilation s'arrête au moment de signer.
      # Relevé le 29 sept. 2026 dans l'interface : « salondz_asc », clé GZ7CF8ABHX.
      app_store_connect: salondz_asc
    # Une compilation iOS se paie à la minute : elle ne part donc PAS à chaque poussée sur main,
    # mais sur une ÉTIQUETTE `ios-…` posée exprès. `git tag ios-3 && git push origin ios-3` suffit,
    # et le numéro de build reste fourni par Codemagic.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    environment:
      vars:
        BUNDLE_ID: dz.salondz.app
        # PROJET, pas espace de travail : Capacitor 8 gère ses dépendances natives par Swift Package
        # Manager (`App/CapApp-SPM/Package.swift`). Il n'y a NI Podfile NI .xcworkspace dans ce
        # dépôt — chercher l'un ou l'autre arrête la compilation avant qu'elle ne commence.
        XCODE_PROJECT: apps/web/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Les valeurs de construction du site vivent dans `.env.production`, versionné : `vite build`
        # le charge tout seul. Les répéter ici les ferait diverger au premier changement.
      node: 22
      xcode: latest
      # Groupe de variables à créer dans Codemagic (Environment variables → group « signing ») :
      #   CERTIFICATE_PRIVATE_KEY = le contenu de `secrets/ios/dist.key`, coché « Secure ».
      # POURQUOI : le compte Apple a déjà TROIS certificats de distribution, son maximum. Codemagic
      # ne peut donc pas en créer un, et sans clé privée il ne peut utiliser aucun des existants —
      # il ne fabriquait alors aucun profil, et Xcode échouait sur un message trompeur à propos des
      # notifications. Cette clé est celle du certificat 52365KLG2Z, créé le 23 sept. 2026.
      groups:
        - signing
    scripts:
      - name: Dépendances du dépôt
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Construction du site
        # Le garde-fou qui manquait : on VÉRIFIE que l'adresse de l'API se retrouve bien dans le
        # bundle. Une variable oubliée ne fait pas échouer Vite — elle fait échouer l'application
        # chez la personne qui l'installe, ce qui se découvre beaucoup trop tard.
        script: |
          pnpm --filter @salondz/web build
          if ! grep -rq "api.salondz.com" apps/web/dist/assets; then
            echo "Le bundle ne contient pas l'adresse de l'API : variables VITE_* manquantes."
            exit 1
          fi
      - name: Synchronisation de la coque iOS
        script: |
          cd apps/web
          npx cap sync ios
      - name: Dépendances natives (Swift Package Manager)
        # `cap sync ios` a déjà écrit Package.swift ; on demande à Xcode de résoudre les paquets
        # maintenant plutôt que pendant la compilation, pour que l'échec éventuel soit lisible.
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Numéro de version
        # Apple refuse un numéro déjà envoyé, et il ne peut jamais redescendre. `BUILD_NUMBER` est
        # fourni par Codemagic et s'incrémente à chaque compilation : rien à tenir à la main, et
        # aucune dépendance à l'identifiant de l'application, inconnu avant sa création.
        script: |
          cd apps/web/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Signature
        script: |
          keychain initialize
          # `--certificate-key` : sans elle, Codemagic cherche à créer un certificat, se heurte à
          # la limite de trois, et repart sans profil. Le profil « Salon DZ App Store » (Z268887ZT3)
          # existe déjà et porte `aps-environment: production` — il sera simplement récupéré.
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --certificate-key=@env:CERTIFICATE_PRIVATE_KEY             --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilation
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Envoi sur TestFlight uniquement : la mise en vente reste une décision humaine.
        submit_to_testflight: true
        submit_to_app_store: false

  # -------------------------------------------------------------------------------------------
  # APPLICATION PROFESSIONNELLE iPhone (`pro.salondz.app`, « Salon DZ Pro »), 10 oct. 2026.
  #
  # Même projet Xcode, même coque, même clé APNs : seules changent QUATRE choses, posées après
  # `cap sync` et avant la compilation — le bundle web (variante pro : les écrans clients ne sont
  # pas livrés), l'identifiant publié, le nom affiché et l'icône (bandeau « PRO »). L'App ID
  # `pro.salondz.app` existe chez Apple avec Push Notifications et Associated Domains
  # (`node scripts/asc-app-id-pro.mjs`, 10 oct. 2026) ; le profil App Store est récupéré ou créé
  # par `fetch-signing-files --create`. Côté serveur, le `apns-topic` suit l'application qui a
  # enregistré le jeton (`push_tokens.app_id`, migration 0051).
  #
  # CE QUI RESTE AU PROPRIÉTAIRE : créer l'application « Salon DZ Pro » dans App Store Connect
  # (bundle `pro.salondz.app`, SKU `salondz-pro`) — l'API ne crée pas une fiche. Sans elle, le
  # build compile mais l'envoi TestFlight échoue sur « app not found ».
  #
  # Lancer : `git tag ios-pro-1 && git push origin ios-pro-1`.
  # -------------------------------------------------------------------------------------------
  ios-pro:
    name: Salon DZ Pro · iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: salondz_asc
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-pro-*'
          include: true
    environment:
      vars:
        BUNDLE_ID: pro.salondz.app
        XCODE_PROJECT: apps/web/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Variante PROFESSIONNELLE : lu par `capacitor.config.ts` (identifiant, nom) et par Vite
        # (`VITE_APP_FLAVOR`, qui retire les écrans clients du bundle).
        SALONDZ_APP_FLAVOR: pro
        VITE_APP_FLAVOR: pro
      node: 22
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Dépendances du dépôt
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Construction du site (variante professionnelle)
        script: |
          pnpm --filter @salondz/web build
          if ! grep -rq "api.salondz.com" apps/web/dist/assets; then
            echo "Le bundle ne contient pas l'adresse de l'API : variables VITE_* manquantes."
            exit 1
          fi
          # Garde-fou de la variante : l'espace client ne doit PAS être dans le bundle.
          if grep -rlq "reserver/coordonnees" apps/web/dist/assets; then
            echo "Le bundle contient le parcours de réservation client : VITE_APP_FLAVOR=pro n'a pas été lu."
            exit 1
          fi
      - name: Synchronisation de la coque iOS
        script: |
          cd apps/web
          npx cap sync ios
      - name: Identité de l'application professionnelle
        # `cap sync` a écrit `appId`/`appName` pro dans capacitor.config.json ; le projet Xcode, lui,
        # garde `dz.salondz.app` en dur — on le remplace, ainsi que le nom affiché, le schéma d'URL
        # et l'icône (jeu `AppIcon-Pro`, produit par `make-capacitor-icons.mjs --pro`).
        script: |
          cd apps/web/ios/App
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = dz\.salondz\.app;/PRODUCT_BUNDLE_IDENTIFIER = pro.salondz.app;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;/ASSETCATALOG_COMPILER_APPICON_NAME = "AppIcon-Pro";/g' App.xcodeproj/project.pbxproj
          plutil -replace CFBundleDisplayName -string "Salon DZ Pro" App/Info.plist
          plutil -replace CFBundleURLTypes.0.CFBundleURLName -string "pro.salondz.app" App/Info.plist
          grep -q "pro.salondz.app" App.xcodeproj/project.pbxproj || { echo "identifiant pro non posé"; exit 1; }
          test -d App/Assets.xcassets/AppIcon-Pro.appiconset || { echo "icône AppIcon-Pro absente : node scripts/make-capacitor-icons.mjs --pro"; exit 1; }
      - name: Dépendances natives (Swift Package Manager)
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Numéro de version
        script: |
          cd apps/web/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Signature
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --certificate-key=@env:CERTIFICATE_PRIVATE_KEY             --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilation
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
