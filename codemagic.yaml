# Compilation iOS de Salon DZ sur macOS distant (Codemagic), puis envoi sur TestFlight.
#
# POURQUOI CE FICHIER : l'application Android se compile sur le PC du propriétaire en quatre minutes,
# mais une application iOS EXIGE macOS — c'est une contrainte d'Apple, pas un choix technique. Ce
# fichier décrit la compilation pour une machine macOS louée à la minute (500 min/mois gratuites),
# afin de ne pas avoir à acheter un Mac.
#
# À FAIRE UNE FOIS, côté Codemagic (interface web) — état au 30 sept. 2026 :
#   1. Connecter ce dépôt GitHub.  ✔ fait
#   2. Ajouter la clé App Store Connect (Teams → Integrations → Apple Developer Portal).
#      ✔ fait : intégration « salondz_asc », Key ID GZ7CF8ABHX. C'est une clé PROPRE à Codemagic,
#      distincte de `secrets/AuthKey_4HZRQ9GV7F.p8` qui sert aux scripts `asc-*` depuis le PC.
#   3. **Régler l'application sur « Use codemagic.yaml »** et non sur le Workflow Editor. Tant
#      qu'elle est sur l'éditeur visuel, CE FICHIER EST IGNORÉ — aucune compilation, aucune erreur,
#      aucune trace. C'est la cause la plus probable du silence observé le 29 sept. : deux
#      étiquettes poussées, zéro build reçu par Apple en 45 minutes.
#   4. Lancer une première compilation À LA MAIN (« Start new build », branche `main`). Codemagic
#      n'arme ses déclencheurs automatiques qu'après avoir vu le dépôt une première fois.
#
# L'application « Salon DZ » existe dans App Store Connect depuis le 29 sept. 2026 (id 6817317513) ;
# sa fiche, ses visuels et sa classification sont remplis par les scripts `scripts/asc-*.mjs`.
workflows:
  ios:
    name: Salon DZ · iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Ce nom doit être EXACTEMENT celui donné à l'intégration dans Codemagic (Teams → Integrations
      # → Apple Developer Portal). S'il diffère, la compilation s'arrête au moment de signer.
      # Relevé le 29 sept. 2026 dans l'interface : « salondz_asc », clé GZ7CF8ABHX.
      app_store_connect: salondz_asc
    # Une compilation iOS se paie à la minute : elle ne part donc PAS à chaque poussée sur main,
    # mais sur une ÉTIQUETTE `ios-…` posée exprès. `git tag ios-3 && git push origin ios-3` suffit,
    # et le numéro de build reste fourni par Codemagic.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    environment:
      vars:
        BUNDLE_ID: dz.salondz.app
        # PROJET, pas espace de travail : Capacitor 8 gère ses dépendances natives par Swift Package
        # Manager (`App/CapApp-SPM/Package.swift`). Il n'y a NI Podfile NI .xcworkspace dans ce
        # dépôt — chercher l'un ou l'autre arrête la compilation avant qu'elle ne commence.
        XCODE_PROJECT: apps/web/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Les valeurs de construction du site vivent dans `.env.production`, versionné : `vite build`
        # le charge tout seul. Les répéter ici les ferait diverger au premier changement.
      node: 22
      xcode: latest
    scripts:
      - name: Dépendances du dépôt
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Construction du site
        # Le garde-fou qui manquait : on VÉRIFIE que l'adresse de l'API se retrouve bien dans le
        # bundle. Une variable oubliée ne fait pas échouer Vite — elle fait échouer l'application
        # chez la personne qui l'installe, ce qui se découvre beaucoup trop tard.
        script: |
          pnpm --filter @salondz/web build
          if ! grep -rq "api.salondz.com" apps/web/dist/assets; then
            echo "Le bundle ne contient pas l'adresse de l'API : variables VITE_* manquantes."
            exit 1
          fi
      - name: Synchronisation de la coque iOS
        script: |
          cd apps/web
          npx cap sync ios
      - name: Dépendances natives (Swift Package Manager)
        # `cap sync ios` a déjà écrit Package.swift ; on demande à Xcode de résoudre les paquets
        # maintenant plutôt que pendant la compilation, pour que l'échec éventuel soit lisible.
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Numéro de version
        # Apple refuse un numéro déjà envoyé, et il ne peut jamais redescendre. `BUILD_NUMBER` est
        # fourni par Codemagic et s'incrémente à chaque compilation : rien à tenir à la main, et
        # aucune dépendance à l'identifiant de l'application, inconnu avant sa création.
        script: |
          cd apps/web/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Signature
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilation
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Envoi sur TestFlight uniquement : la mise en vente reste une décision humaine.
        submit_to_testflight: true
        submit_to_app_store: false
