# Compilation iOS de Salon DZ sur macOS distant (Codemagic), puis envoi sur TestFlight.
#
# POURQUOI CE FICHIER : l'application Android se compile sur le PC du propriétaire en quatre minutes,
# mais une application iOS EXIGE macOS — c'est une contrainte d'Apple, pas un choix technique. Ce
# fichier décrit la compilation pour une machine macOS louée à la minute (500 min/mois gratuites),
# afin de ne pas avoir à acheter un Mac.
#
# À FAIRE UNE FOIS, côté Codemagic (interface web) :
#   1. Connecter ce dépôt GitHub.
#   2. Ajouter la clé App Store Connect : Teams → Integrations → Developer Portal.
#      Fichier `secrets/AuthKey_4HZRQ9GV7F.p8`, Key ID 4HZRQ9GV7F,
#      Issuer ID b02ec096-b36d-489d-9348-e4850df4f647.
#   3. Créer l'application « Salon DZ » dans App Store Connect (bundle dz.salondz.app, SKU salondz) :
#      l'API d'Apple ne permet PAS de la créer, c'est la seule étape manuelle obligatoire.
workflows:
  ios:
    name: Salon DZ · iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Ce nom doit être EXACTEMENT celui donné à l'intégration dans Codemagic (Teams → Integrations
      # → App Store Connect). S'il diffère, la compilation s'arrête au moment de signer.
      app_store_connect: salondz
    environment:
      vars:
        BUNDLE_ID: dz.salondz.app
        XCODE_WORKSPACE: apps/web/ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dépendances du dépôt
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Construction du site
        script: pnpm --filter @salondz/web build
      - name: Synchronisation de la coque iOS
        script: |
          cd apps/web
          npx cap sync ios
      - name: Dépendances natives
        script: |
          cd apps/web/ios/App
          pod install
      - name: Numéro de version
        # Apple refuse un numéro déjà envoyé, et il ne peut jamais redescendre. `BUILD_NUMBER` est
        # fourni par Codemagic et s'incrémente à chaque compilation : rien à tenir à la main, et
        # aucune dépendance à l'identifiant de l'application, inconnu avant sa création.
        script: |
          cd apps/web/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Signature
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilation
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Envoi sur TestFlight uniquement : la mise en vente reste une décision humaine.
        submit_to_testflight: true
        submit_to_app_store: false
