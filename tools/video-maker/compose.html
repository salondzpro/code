<!doctype html>
<meta charset="utf-8" />
<style>
  /*FONTS*/
  body { margin: 0; background: #fff; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
  // Le montage : papier quadrillé, titre, téléphone avec l'écran filmé, main et fin. 720 × 1280 agrandi × 1,5.
  const W = 720, H = 1280, S = 1.5, PW = 390, PH = 844;
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  let C = {};
  let cfg = {};
  const OUTFIT = 'Outfit, sans-serif', SERIF = '"Instrument Serif", serif', MONO = 'Consolas, Menlo, monospace';
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const ease = (x) => { const k = clamp(x); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
  const mix = (a, b, k) => a + (b - a) * k;
  const HAND = new Path2D('M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L6 14V4a2 2 0 0 1 4 0v5.5V9a2 2 0 0 1 4 0v1v0a2 2 0 0 1 4 0z');

  function line(text, x, y, font, color, align = 'left') {
    g.font = font; g.fillStyle = color; g.textAlign = align; g.fillText(text, x, y);
  }
  function shrink(text, font, size, max) {
    let px = size; g.font = font(px);
    while (px > 24 && g.measureText(text).width > max) { px -= 2; g.font = font(px); }
    return px;
  }
  function rr(x, y, w, h, r, fill) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill(); }

  window.setup = async (o) => {
    cfg = o; C = o.colors;
    await Promise.all(['700 60px Outfit', '500 40px Outfit', 'italic 400 70px "Instrument Serif"'].map((f) => document.fonts.load(f)));
    if (o.avatar) { cfg.avatarImg = new Image(); cfg.avatarImg.crossOrigin = 'anonymous'; cfg.avatarImg.src = o.avatar; await cfg.avatarImg.decode().catch(() => {}); }
  };
  let shot = null;
  window.setShot = async (data) => {
    const img = new Image(); img.src = `data:image/jpeg;base64,${data}`; await img.decode(); shot = img;
  };

  function drawTitle(ms) {
    const t = [...cfg.scenes].reverse().find((x) => ms >= x.ms && x.title);
    if (!t) return;
    const k = ms - t.ms, T = t.title;
    line(`// ${T.note}`, 48, 110, `400 19px ${MONO}`, C.subtle);
    const a = out(k / 350);
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 18);
    line(T.a, 46, 190, `700 62px ${OUTFIT}`, C.ink);
    g.restore();
    const b = out((k - 220) / 400);
    g.save(); g.globalAlpha = b; g.translate(0, (1 - b) * 18);
    let x = 46;
    if (T.b) { line(T.b, x, 266, `500 56px ${OUTFIT}`, C.subtle); x += g.measureText(T.b).width + (T.b.endsWith('’') ? 2 : 14); }
    const f = (p) => `italic 400 ${p}px ${SERIF}`;
    line(T.c, x, 266, f(shrink(T.c, f, 74, W - x - 40)), C.accent);
    g.restore();
  }

  function drawHand(ms) {
    const taps = cfg.taps;
    if (!taps.length || ms < taps[0].ms - 900 || ms > taps[taps.length - 1].ms + 500) return;
    const next = taps.findIndex((t) => t.ms >= ms);
    const coming = next === -1 ? null : taps[next];
    const gone = taps[(next === -1 ? taps.length : next) - 1];
    // Entre deux gestes, la main s'efface.
    if ((!coming || coming.ms - ms > 800) && (!gone || ms - gone.ms > 550)) return;
    const to = taps[next === -1 ? taps.length - 1 : next];
    const from = taps[Math.max(0, (next === -1 ? taps.length : next) - 1)];
    const k = ease(1 - (to.ms - ms) / 650);
    const start = from === to ? { x: to.x + 70, y: to.y + 180 } : from;
    const x = mix(start.x, to.x, k), y = mix(start.y, to.y, k);
    const near = taps.find((t) => ms >= t.ms - 40 && ms <= t.ms + 480);
    if (near) {
      const r = clamp((ms - near.ms) / 480);
      g.strokeStyle = `rgba(108,92,231,${0.55 * (1 - r)})`; g.lineWidth = 2;
      g.beginPath(); g.arc(near.x, near.y, 8 + r * 30, 0, 7); g.stroke();
    }
    const press = near && ms - near.ms < 120 ? 0.88 : 1;
    g.save(); g.translate(x - 16 * press, y - 4 * press); g.scale(2.3 * press, 2.3 * press);
    g.fillStyle = '#fff'; g.fill(HAND); g.strokeStyle = C.ink; g.lineWidth = 0.95; g.lineJoin = 'round'; g.stroke(HAND);
    g.restore();
  }

  function phone(ms) {
    const come = out(ms / 800), back = ease((ms - cfg.pageAt + 150) / 500);
    const s = mix(mix(0.9, 1.42, come), 1.02, back);
    const y = mix(mix(760, 410, come), 344, back);
    g.save(); g.translate((W - PW * s) / 2, y); g.scale(s, s);
    g.shadowColor = 'rgba(30,27,48,.16)'; g.shadowBlur = 50; g.shadowOffsetY = 18;
    rr(-11, -11, PW + 22, PH + 22, 58, '#14121f');
    g.shadowColor = 'transparent';
    g.save(); g.beginPath(); g.roundRect(0, 0, PW, PH, 46); g.clip();
    g.fillStyle = '#fff'; g.fillRect(0, 0, PW, PH);
    if (shot) g.drawImage(shot, 0, 44, PW, PH - 44);
    g.fillStyle = '#fff'; g.fillRect(0, 0, PW, 44);
    line('9:41', 60, 31, `600 15px ${OUTFIT}`, C.ink, 'center');
    rr(136, 11, 118, 30, 15, '#000');
    [5, 8, 11, 14].forEach((h, i) => rr(318 + i * 5, 29 - h, 3, h, 1, C.ink));
    rr(342, 18, 24, 12, 3, C.ink);
    g.restore();
    g.translate(0, 44);
    drawHand(ms);
    g.restore();
  }

  function end(ms) {
    const p = cfg.profile, a = out(ms / 450);
    g.save(); g.globalAlpha = a;
    g.strokeStyle = C.accent; g.lineWidth = 4; g.beginPath(); g.arc(W / 2, 330, 96, 0, 7); g.stroke();
    g.save(); g.beginPath(); g.arc(W / 2, 330, 86, 0, 7); g.clip();
    if (cfg.avatarImg?.width) { const i = cfg.avatarImg, k = Math.max(172 / i.width, 172 / i.height); g.drawImage(i, W / 2 - i.width * k / 2, 330 - i.height * k / 2, i.width * k, i.height * k); }
    else { g.fillStyle = C.accent; g.fillRect(W / 2 - 90, 240, 180, 180); }
    g.restore(); g.restore();
    g.globalAlpha = out((ms - 300) / 450);
    const f = (px) => `700 ${px}px ${OUTFIT}`;
    line(p.name, W / 2, 530, f(shrink(p.name, f, 66, 640)), C.ink, 'center');
    g.globalAlpha = out((ms - 650) / 450);
    g.font = `500 42px ${OUTFIT}`; const left = 'Réservez en '; const lw = g.measureText(left).width;
    g.font = `italic 400 58px ${SERIF}`; const rw = g.measureText('30 secondes.').width;
    const x = (W - lw - rw) / 2;
    line(left, x, 610, `500 42px ${OUTFIT}`, C.subtle); line('30 secondes.', x + lw, 610, `italic 400 58px ${SERIF}`, C.accent);
    g.globalAlpha = out((ms - 1100) / 450);
    rr(W / 2 - 200, 780, 400, 76, 38, C.accent);
    line('👆 Lien dans notre bio', W / 2, 829, `600 28px ${OUTFIT}`, '#fff', 'center');
    line(`salondz.com/${p.slug}`, W / 2, 900, `400 24px ${MONO}`, C.ink, 'center');
    g.globalAlpha = out((ms - 1500) / 450);
    line('réservation en ligne · Salon DZ', W / 2, 1120, `400 19px ${MONO}`, C.subtle, 'center');
    g.globalAlpha = 1;
  }

  window.frame = (ms) => {
    g.setTransform(S, 0, 0, S, 0, 0);
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    if (ms >= cfg.endAt) end(ms - cfg.endAt);
    else {
      g.fillStyle = '#f4f3fa';
      for (let x = 40; x < W; x += 60) g.fillRect(x, 0, 1, H);
      for (let y = 40; y < H; y += 60) g.fillRect(0, y, W, 1);
      const code = `00:00:${String(Math.floor(ms / 1000)).padStart(2, '0')}:${String(Math.floor((ms % 1000) / 33.34)).padStart(2, '0')}`;
      line('// comment réserver', 48, 66, `400 19px ${MONO}`, C.subtle);
      line(code, W - 48, 66, `400 19px ${MONO}`, C.subtle, 'right');
      drawTitle(ms);
      phone(ms);
    }
    return c.toDataURL('image/jpeg', 0.92).split(',')[1];
  };
</script>
