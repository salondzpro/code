name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages + api + web + mobile)
        run: pnpm -r --filter "./packages/*" --filter @salondz/api --filter @salondz/web --filter @salondz/mobile typecheck
      - name: Unit tests (validation)
        run: pnpm --filter @salondz/validation test
      - name: Build web
        run: pnpm --filter @salondz/web build
        env:
          VITE_SUPABASE_URL: https://thpwvmtqzhtqlosgvced.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: https://api.salondz.com
      - name: Build api bundle
        run: pnpm --filter @salondz/api build

  # Déploiement Render après les vérifications (main seulement). Sans le secret RENDER_API_KEY, l'étape
  # est sautée : les déploiements restent alors manuels (scripts/render-web.mjs, API Render).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API + site
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo 'RENDER_API_KEY absent : déploiement manuel'; exit 0; fi
          for svc in srv-dag7cr740ujc738dm7r0 srv-dag8d4142hec73elbuug; do
            curl -sf -X POST "https://api.render.com/v1/services/$svc/deploys" -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' -d '{"clearCache":"do_not_clear"}' >/dev/null && echo "déploiement lancé : $svc"
          done

  # Tests de bout en bout contre Supabase (secrets requis) — uniquement sur main
  e2e:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API e2e
        run: pnpm --filter @salondz/api exec tsx --test test/*.test.ts
        env:
          SUPABASE_URL: https://thpwvmtqzhtqlosgvced.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          INTERNAL_CRON_TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
          LOG_LEVEL: silent
